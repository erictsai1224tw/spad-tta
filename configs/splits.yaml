  secondary:
    name: dynamic_adaptation_balanced
    manifest: configs/manifests/dynamic_adaptation_balanced.tsv
    rule: 960 frames per class drawn from that class's pool; CONSTRUCTION-TIME LABEL-AWARE (directory labels used
      once here); manifest carries no labels
    seed: 20260822 + class_id
    n: 19200
    balanced: true
    quota_per_class: 960
    disclosure: must be reported as a secondary controlled analysis and disclosed in the paper
  stream: fixed permutation (seeds above); batches read in stream_position order; no future batches
  label_isolation: 'adaptation manifests/exports contain none of: class_label, class_folder_id, source_path, frame_index,
    direction_id, md5. DISCLOSURE: configs/manifests/internal/audit_all_primary.tsv is the reverse map (sample_id -> source_path,
    class) and must be withheld whenever an adaptation manifest/export is distributed for blind evaluation; it is
    for audit/evaluation code only'
  audit_manifest:
    path: configs/manifests/internal/audit_all_primary.tsv
    contains: labels, source paths, adaptation membership and stream positions for all 45851 primary files
    access: audit/evaluation only; never readable by adaptation code; withhold when distributing adaptation manifests/exports
  frame_index_exclusion_reason: in the pool, frame_index > 1117 occurs only in class 15; the literal filename index
    would identify the majority class
